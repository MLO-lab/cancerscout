[tool.poetry]
name = "cancerscout"
version = "0.1.0"
description = "Proteogenomic characterisation of colorectal cancer."
readme = "README.md"
authors = ["Arber Qoku <arber.qoku@dkfz-heidelberg.com>"]
homepage = "https://github.com/MLO-lab/cancerscout"
repository = "https://github.com/MLO-lab/cancerscout"

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = ">=3.10,<3.11"
numpy = "^1.26.1"
pandas = "^2.1.1"
scikit-learn = "1.5.2"
tqdm = "^4.66.1"
seaborn = "0.12.2"
scanpy = "^1.9.6"
leidenalg = "^0.10.1"
tabulate = "^0.9.0"
gseapy = "1.0.5"
scipy = "^1.14.1"
statsmodels = "^0.14.4"
matplotlib = "^3.10.0"
adjustText = "^1.3.0"
anndata = "^0.11.4"
mudata = "^0.3.2"
lifelines = "^0.30.0"
xgboost = "^2.1.3"
shap = "^0.46.0"
optuna = "^4.2.0"
ray = "^2.55.1"
plotly = "^6.7.0"
kaleido = "0.2.1"
openpyxl = "^3.1.5"
pillow = "^11.0.0"
cclf = { git = "https://github.com/MLO-lab/consensus-classifier.git", tag = "v0.2.0" }
# muvi 0.1.1 (PyPI) is also required. It is pinned only in envs/proj-requirements.txt
# because its metadata declares mudata<0.3 and seaborn>=0.13, while the results were produced
# with mudata 0.3.2 and seaborn 0.12.2.

[tool.poetry.group.dev.dependencies]
black = "^23.10.1"
