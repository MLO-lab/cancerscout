# Conda part of the environment the paper's results were produced in.
# Create with:  conda env create -f envs/proj.yml
# then install the pip part:  conda run -n proj pip install --no-deps -r envs/proj-requirements.txt
# and this package:           conda run -n proj pip install --no-deps -e .
name: proj
